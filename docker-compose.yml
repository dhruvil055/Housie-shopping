version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: housie-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: housie_shopping
    volumes:
      - mongo_data:/data/db
    networks:
      - housie-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: housie-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/housie_shopping
      - JWT_SECRET=housie_production_jwt_super_secret_signing_key_2026_xyz
      - JWT_REFRESH_SECRET=housie_production_jwt_refresh_rotation_secret_key_2026_xyz
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - RAZORPAY_KEY_ID=rzp_live_placeholder
      - RAZORPAY_KEY_SECRET=rzp_live_secret_placeholder
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - housie-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local

networks:
  housie-net:
    driver: bridge